[pytest]
pythonpath = . src
markers =
    legacy: Tests that verify deprecated V0 behaviors (to be migrated deliberately).
    postgres: Tests that explicitly require a PostgreSQL database.
    provider_mock: Tests that rely on a provider double or mock.
    v1: Tests that specifically verify V1 architectural constraints.
    e2e: End-to-end integration tests spanning the entire application.

addopts = -m "not postgres and not legacy"
