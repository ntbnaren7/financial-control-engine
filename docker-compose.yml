version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fce"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  worker-a:
    build: .
    environment:
      - ENVIRONMENT=production
      - DATABASE__URL=postgresql+psycopg://postgres:postgres@postgres:5432/fce
      - RAZORPAY__KEY_ID=dummy_key
      - RAZORPAY__KEY_SECRET=dummy_secret
      - WORKER_ID=worker-a
      - FCE_MOCK_MODE=1
      - CONTROL_LOOP__EVENT_STALE_THRESHOLD_SECONDS=2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  worker-b:
    build: .
    environment:
      - ENVIRONMENT=production
      - DATABASE__URL=postgresql+psycopg://postgres:postgres@postgres:5432/fce
      - RAZORPAY__KEY_ID=dummy_key
      - RAZORPAY__KEY_SECRET=dummy_secret
      - WORKER_ID=worker-b
      - FCE_MOCK_MODE=1
      - CONTROL_LOOP__EVENT_STALE_THRESHOLD_SECONDS=2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"

volumes:
  ollama_data:
